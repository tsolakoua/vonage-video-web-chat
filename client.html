<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video room</title>
    <link href="css/app.css" rel="stylesheet" type="text/css">
    <script src="https://video.standard.vonage.com/v2/js/opentok.min.js"></script>
</head>
<body>

    <pre id="credentials"></pre>

    <div id="publisher-controls">
        <button id="toggle-video" type="button" aria-label="Turn video off" title="Turn video off">
            <svg class="icon-on" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M15 10.5 20.5 7v10L15 13.5M4 6.5h8a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"/></svg>
            <svg class="icon-off" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="M15 10.5 20.5 7v10L15 13.5M4 6.5h8a3 3 0 0 1 3 3v5a3 3 0 0 1-3 3H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2ZM3 3l18 18"/></svg>
            <span class="button-label">Turn video off</span>
        </button>
        <button id="toggle-audio" type="button" aria-label="Mute microphone" title="Mute microphone">
            <svg class="icon-on" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8"/></svg>
            <svg class="icon-off" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4M8 22h8M3 3l18 18"/></svg>
            <span class="button-label">Mute microphone</span>
        </button>
        <button id="toggle-background-blur" type="button" aria-label="Remove background blur" title="Remove background blur">
            <svg class="icon-on" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3ZM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg>
            <svg class="icon-off" aria-hidden="true" viewBox="0 0 24 24" focusable="false"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8L12 3ZM19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16ZM3 3l18 18"/></svg>
            <span class="button-label">Remove background blur</span>
        </button>
    </div>

    <div id="videos">
        <div id="subscriber"></div>
        <div id="publisher"></div>
    </div>

    <script type="text/javascript" src="js/app.js"></script>
</body>
</html>
